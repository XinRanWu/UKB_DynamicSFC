name: Repository checks

on:
  push:
  pull_request:

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.0'
      - name: Check repository structure and code conventions
        run: python3 tests/check_repository.py
      - name: Parse R scripts
        run: Rscript tests/parse_all_R.R
